<title>Hoard Village</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One-screen game: the canvas fills the frame; a title card starts it. Single dark look on purpose. */
:root {
  --night: #120c18; --panel: #2a1d33; --cream: #f6ead2; --muted: #b9a7c4; --blood: #e0304e; --bile: #b6e04a; --line: #4a3557;
  --display: "Pixelify Sans", ui-monospace, monospace; --body: "IBM Plex Sans", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--cream); font-family: var(--body); overflow: hidden; }
#canvas { display: block; width: 100%; height: 100%; outline: none; background: var(--night); }
#start {
  position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto;
  padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(circle at 50% 30%, #2a1236 0%, var(--night) 70%);
}
#start[hidden] { display: none; }
.card { max-width: 32rem; display: grid; gap: 14px; }
h1 { font-family: var(--display); font-weight: 600; font-size: 3.2rem; margin: 0; letter-spacing: 0.02em; color: var(--cream); text-shadow: 3px 3px 0 var(--blood); }
p { margin: 0; line-height: 1.55; color: var(--muted); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 0.95rem; }
kbd { font-family: var(--display); background: var(--panel); border: 1px solid var(--line); border-bottom-width: 3px; padding: 1px 7px; color: var(--cream); white-space: nowrap; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
button { font: 600 1.05rem var(--display); color: var(--night); background: var(--bile); border: 0; border-bottom: 4px solid #6f8f2a; padding: 10px 22px; cursor: pointer; }
button.quiet { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 8px 14px; font-size: 0.9rem; }
button:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }
button:disabled { opacity: 0.6; cursor: progress; }
#status { font-size: 0.9rem; min-height: 1.4em; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Pixelify+Sans:wght@600&display=swap">

<canvas id="canvas" tabindex="0">Your browser does not support the canvas tag.</canvas>
<div id="start">
  <div class="card">
    <h1>Hoard</h1>
    <!--INTRO-->
    <div class="keys">
      <span><kbd>WASD</kbd> <kbd>arrows</kbd></span><span>Walk</span>
      <span><kbd>E</kbd> <kbd>Space</kbd></span><span>Talk, look, choose</span>
      <span><kbd>Esc</kbd></span><span>Back out of a menu</span>
      <span><kbd>N</kbd></span><span>Let a day pass (demo)</span>
      <span><kbd>[</kbd> <kbd>]</kbd></span><span>Earlier or later week</span>
    </div>
    <p>All the money here is fake. Your progress saves in this browser.</p>
    <div class="row">
      <button id="go" type="button">Enter the village</button>
      <button id="reset" class="quiet" type="button">Start over</button>
    </div>
    <p id="status" role="status"></p>
  </div>
</div>

<script>window.HOARD_FILES = /*FILES*/{};</script>
<script>/*PYODIDE_JS*/</script>
<script>/*PYODIDE_ASM_JS*/</script>
<script>/*BRIDGE_JS*/</script>
<script>/*GODOT_JS*/</script>
<script>
const CONFIG = /*GODOT_CONFIG*/{};
const go = document.getElementById("go");
const reset = document.getElementById("reset");
const status = document.getElementById("status");
const say = (text) => { status.textContent = text; };
reset.addEventListener("click", async () => {
  reset.disabled = true;
  await window.hoard.reset();
  say("Your save is cleared. The village starts fresh next time you enter.");
});
go.addEventListener("click", async () => {
  go.disabled = true;
  reset.disabled = true;
  try {
    await window.hoard.start(say);
  } catch (err) {
    go.disabled = false;
    say("The village engine could not start: " + (err && err.message ? err.message : err));
    return;
  }
  say("Opening the gates...");
  const engine = new Engine(CONFIG);
  engine.startGame({
    onProgress: (current, total) => {
      if (total <= 0) return;
      say("Opening the gates... " + Math.round((current / total) * 100) + "%");
      if (current >= total) {
        document.getElementById("start").hidden = true;
        document.getElementById("canvas").focus();
      }
    },
  }).catch((err) => {
    document.getElementById("start").hidden = false;
    go.disabled = false;
    say("The game could not start: " + (err && err.message ? err.message : err));
  });
});
</script>
